app = "studyquest-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"
  target = "production"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  TYPEORM_SYNC = "true"
  TYPEORM_LOGGING = "false"
  JWT_EXPIRES_IN = "7d"
  AI_PROVIDER = "gemini"
  GEMINI_MODEL = "gemini-2.5-flash"
  MARKITDOWN_URL = "https://studyquest-markitdown.fly.dev"
  # DATABASE_URL, JWT_SECRET y GEMINI_API_KEY se setean como secrets (fly secrets set)

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
