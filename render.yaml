# Render Blueprint — StudyQuest (monorepo LorenGrz/StudyQuest)
#
# Servicios gratuitos:
#   studyquest-api         → https://studyquest-api.onrender.com        (Docker / NestJS)
#   studyquest-markitdown  → https://studyquest-markitdown.onrender.com  (Docker / Python)
#   studyquest-web         → https://studyquest.onrender.com             (Static Site / Vite)
#   studyquest-db          → PostgreSQL free (~90 días, TypeORM sync recrea el esquema)
#
# Secrets que se cargan A MANO en el dashboard de Render (nunca en el repo):
#   JWT_SECRET      → string aleatorio ≥32 caracteres
#   GEMINI_API_KEY  → clave de Google AI Studio
#
# Nota: el plan free duerme tras 15 min de inactividad (cold start ~60s).
#       Las conexiones WebSocket se cortan durante el sleep y reconectan al despertar.
#       El free PostgreSQL expira a los 90 días — los datos se pierden, el esquema
#       se recrea solo porque TYPEORM_SYNC=true.

databases:
  - name: studyquest-db
    plan: free
    region: oregon
    databaseName: studyquest
    user: studyquest

services:
  - type: web
    name: studyquest-api
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/LorenGrz/StudyQuest
    branch: dev
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TYPEORM_SYNC
        value: "true"
      - key: TYPEORM_LOGGING
        value: "false"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MARKITDOWN_URL
        value: https://studyquest-markitdown.onrender.com
      - key: CORS_ORIGIN
        value: https://studyquest.onrender.com
      - key: POSTGRES_HOST
        fromDatabase:
          name: studyquest-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: studyquest-db
          property: port
      - key: POSTGRES_USER
        fromDatabase:
          name: studyquest-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: studyquest-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: studyquest-db
          property: database
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: studyquest-markitdown
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/LorenGrz/StudyQuest
    branch: dev
    rootDir: markitdown-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health

  - type: web
    runtime: static
    name: studyquest-web
    repo: https://github.com/LorenGrz/StudyQuest
    branch: dev
    rootDir: frontend
    buildCommand: npm install -g pnpm@11 && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://studyquest-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
