# Render Blueprint — StudyQuest (monorepo LorenGrz/StudyQuest)
#
# Servicios gratuitos:
#   studyquest-api         → https://studyquest-api.onrender.com        (Docker / NestJS)
#   studyquest-markitdown  → https://studyquest-markitdown.onrender.com  (Docker / Python)
#   studyquest-web         → https://studyquest.onrender.com             (Static Site / Vite)
#
# DB: Aiven free tier (PostgreSQL, 1 GB) — migrado desde Neon por límite de espacio.
#     QuestRetentionService borra quests + PDFs con más de QUEST_RETENTION_DAYS días
#     para no volver a llenar el free tier.
#
# Secrets que se cargan A MANO en el dashboard de Render (nunca en el repo):
#   DATABASE_URL    → connection string de Aiven (postgres://avnadmin:...aivencloud.com:.../defaultdb?sslmode=require)
#   JWT_SECRET      → string aleatorio ≥32 caracteres
#   GEMINI_API_KEY  → clave de Google AI Studio
#
# Nota: el plan free duerme tras 15 min de inactividad (cold start ~60s).
#       Las conexiones WebSocket se cortan durante el sleep y reconectan al despertar.

services:
  - type: web
    name: studyquest-api
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/LorenGrz/StudyQuest
    branch: dev
    rootDir: backend
    buildCommand: npm install -g pnpm@11 && pnpm install --frozen-lockfile && pnpm build
    startCommand: node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: TYPEORM_SYNC
        value: "true"
      - key: TYPEORM_LOGGING
        value: "false"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: MARKITDOWN_URL
        value: https://studyquest-markitdown.onrender.com
      - key: QUEST_RETENTION_DAYS
        value: "7"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: studyquest-markitdown
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/LorenGrz/StudyQuest
    branch: dev
    rootDir: markitdown-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health

  - type: web
    runtime: static
    name: studyquest-web
    repo: https://github.com/LorenGrz/StudyQuest
    branch: dev
    rootDir: frontend
    buildCommand: npm install -g pnpm@11 && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://studyquest-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
